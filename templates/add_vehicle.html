{% extends 'base.html' %}
{% block content %}
<div class="form-card">
    <p class="eyebrow">YOUR GARAGE</p>
    <h1>Add a vehicle</h1>
    <p>Keep its details handy for easier bookings.</p>
    <form method="post" class="form-grid">{% csrf_token %}{% for field in form %}
        <label>{{ field.label }}{{ field }}{% for error in field.errors %}
             <small class="error">{{ error }} </small>{% endfor %}
        </label>{% endfor %}
        <button>Add vehicle</button>
    </form>
</div>{% endblock %}
