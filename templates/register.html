{% extends 'base.html' %}
{% block title %}Create account | CareX{% endblock %}
{% block content %}
<div class="form-card narrow">
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your account</h1>
    <form method="post">{% csrf_token %}{% for field in form %}
        <label>{{ field.label }}{{ field }}{% for error in field.errors %}
            <small class="error">{{ error }}</small>{% endfor %}
        </label>{% endfor %}
        <button>Create account</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
</div>{% endblock %}
